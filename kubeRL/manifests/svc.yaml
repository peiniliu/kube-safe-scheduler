    port: 2379
    protocol: TCP
    targetPort: 2379
  - name: peer
    port: 2380
    protocol: TCP
    targetPort: 2380
  selector:
    app: etcd
    etcd_cluster: rl-etcd
  sessionAffinity: None
  type: ClusterIP
